<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">

  <!-- Dark background -->
  <rect width="600" height="380" fill="#050505"/>

  <!-- ═══════════════════════════════════════ -->
  <!--          GEOMETRIC MARK               -->
  <!-- Center: (300, 100)                    -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Outer decorative ring (very subtle) -->
  <circle cx="300" cy="100" r="80" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.08"/>

  <!-- Main C arc: radius 60, 270°, opening right -->
  <!-- Start at 45°: (342, 58)  End at 315°: (342, 142) -->
  <!-- Counterclockwise large arc: large-arc=1, sweep=0 -->
  <path d="M 342,58 A 60,60 0 1,0 342,142"
        stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Inner echo arc: radius 44 -->
  <!-- Start at 45°: (331, 69)  End at 315°: (331, 131) -->
  <path d="M 331,69 A 44,44 0 1,0 331,131"
        stroke="#D4AF37" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.28"/>

  <!-- Endpoint dots on outer arc -->
  <circle cx="342" cy="58"  r="2.5" fill="#D4AF37"/>
  <circle cx="342" cy="142" r="2.5" fill="#D4AF37"/>

  <!-- ─── Star accent above mark ─── -->
  <!-- Top of arc at 90°: (300, 40). Star at (300, 22). Connecting line between. -->
  <line x1="300" y1="31" x2="300" y2="40" stroke="#D4AF37" stroke-width="0.75" opacity="0.28"/>

  <g transform="translate(300, 22)">
    <line x1="0" y1="-9" x2="0" y2="9"     stroke="#D4AF37" stroke-width="0.85" opacity="0.8"/>
    <line x1="-9" y1="0" x2="9" y2="0"    stroke="#D4AF37" stroke-width="0.85" opacity="0.8"/>
    <line x1="-6.4" y1="-6.4" x2="6.4" y2="6.4"  stroke="#D4AF37" stroke-width="0.5"  opacity="0.45"/>
    <line x1="6.4"  y1="-6.4" x2="-6.4" y2="6.4" stroke="#D4AF37" stroke-width="0.5"  opacity="0.45"/>
    <circle cx="0" cy="0" r="2.5" fill="#D4AF37"/>
  </g>

  <!-- ─── Center vertical spine ─── -->
  <line x1="300" y1="68" x2="300" y2="132" stroke="#D4AF37" stroke-width="0.75" opacity="0.3"/>

  <!-- Tick marks on spine -->
  <line x1="294" y1="80"  x2="306" y2="80"  stroke="#D4AF37" stroke-width="0.75" opacity="0.4"/>
  <line x1="294" y1="120" x2="306" y2="120" stroke="#D4AF37" stroke-width="0.75" opacity="0.4"/>

  <!-- Center diamond -->
  <polygon points="300,94 306,100 300,106 294,100" fill="#D4AF37"/>


  <!-- ═══════════════════════════════════════ -->
  <!--           BRAND HIERARCHY             -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Top rule -->
  <line x1="60" y1="192" x2="540" y2="192" stroke="#D4AF37" stroke-width="0.5" opacity="0.1"/>

  <!-- ──────────────────────────────── -->
  <!-- CATALYST CONCEPTS  (Parent / HQ) -->
  <!-- ──────────────────────────────── -->
  <text
    x="300" y="230"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="32" font-weight="700" letter-spacing="9"
    text-anchor="middle" fill="#D4AF37">
    CATALYST CONCEPTS
  </text>

  <!-- HQ descriptor -->
  <text
    x="300" y="249"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="7.5" font-weight="300" letter-spacing="4.5"
    text-anchor="middle" fill="#D4AF37" opacity="0.35">
    MAIN HEADQUARTERS  ·  ESTABLISHED LAGOS 2025
  </text>


  <!-- ─── Divider with centre diamond ─── -->
  <line x1="100" y1="267" x2="266" y2="267" stroke="#D4AF37" stroke-width="0.5" opacity="0.14"/>
  <polygon points="300,262 305,267 300,272 295,267" fill="#D4AF37" opacity="0.5"/>
  <line x1="334" y1="267" x2="500" y2="267" stroke="#D4AF37" stroke-width="0.5" opacity="0.14"/>


  <!-- ─────────────────────────────────────── -->
  <!-- CATALYST TALENTS LAGOS  (Division)      -->
  <!-- ─────────────────────────────────────── -->
  <text
    x="300" y="299"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="21" font-weight="400" letter-spacing="5"
    text-anchor="middle" fill="#D4AF37" opacity="0.9">
    CATALYST TALENTS LAGOS
  </text>

  <!-- Division label -->
  <text
    x="300" y="317"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="7" font-weight="300" letter-spacing="3.5"
    text-anchor="middle" fill="#D4AF37" opacity="0.26">
    A DIVISION OF CATALYST CONCEPTS
  </text>


  <!-- Bottom rule -->
  <line x1="60" y1="338" x2="540" y2="338" stroke="#D4AF37" stroke-width="0.5" opacity="0.07"/>

</svg>
