<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sneakers Fest Forms</title>
  </head>
  <body>
    <form name="waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="interest" />
      <input name="source" />
      <input name="refCode" />
    </form>

    <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input name="bot-field" />
      <input name="email" />
      <input name="interests" />
      <input name="source" />
    </form>

    <form name="community-cup-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="community-cup-interest" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="team" />
      <input name="role" />
    </form>

    <form name="vendor-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="vendor-interest" />
      <input name="bot-field" />
      <input name="businessName" />
      <input name="contactName" />
      <input name="email" />
      <input name="phone" />
      <input name="category" />
      <input name="boothTier" />
      <input name="socialUrl" />
      <textarea name="notes"></textarea>
      <input name="source" />
    </form>

    <form name="sponsor-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="sponsor-interest" />
      <input name="bot-field" />
      <input name="company" />
      <input name="contactName" />
      <input name="email" />
      <input name="phone" />
      <input name="budget" />
      <input name="partnershipType" />
      <textarea name="goals"></textarea>
      <input name="source" />
    </form>

    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="topic" />
      <textarea name="message"></textarea>
      <input name="source" />
    </form>
    <form name="marketplace-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="marketplace-interest" />
      <input name="bot-field" /><input name="name" /><input name="brand" /><input name="size" /><input name="price" />
      <input name="condition" /><input name="type" /><input name="contact" /><input name="source" />
    </form>
  </body>
</html>
