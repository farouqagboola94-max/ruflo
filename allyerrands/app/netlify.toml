# Netlify config for the AllyErrands Next.js app.
#
# Deploy as its OWN Netlify site (separate from the static marketing site).
# In the Netlify UI, set this app's "Base directory" to: allyerrands/app
# so this file and package.json resolve correctly in the monorepo.
#
# The @netlify/plugin-nextjs runtime adapts Next.js API routes, SSR, and
# middleware to Netlify Functions automatically — no manual redirects needed.
#
# Required environment variables (set in Netlify UI → Site settings → Environment,
# NOT committed here):
#   NEXTAUTH_SECRET   — random 32+ char secret for NextAuth session signing
#   NEXTAUTH_URL      — the deployed site URL, e.g. https://za-allyerrands-app.netlify.app
#   DATABASE_URL      — Prisma connection string
#
# NOTE: the bundled SQLite dev DB (db/custom.db) does NOT persist on Netlify's
# serverless functions — each invocation gets a fresh read-only filesystem.
# It works for a demo build, but for production point DATABASE_URL at a hosted
# Postgres (e.g. Supabase — a schema already exists at allyerrands/supabase/)
# and update prisma/schema.prisma's datasource provider to "postgresql".

[build]
  command = "npx prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
