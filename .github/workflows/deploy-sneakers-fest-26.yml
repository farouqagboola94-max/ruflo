name: Deploy Sneakers Fest 26 to Netlify

on:
  push:
    branches:
      - claude/build-sneakers-fest-website-3kNsb
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: bd236657-e156-4ec8-882d-6d3f393f7307
        run: npx netlify-cli deploy --dir=dist --prod
