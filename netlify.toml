[build]
  base    = "sneakers-fest"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# 404 fallback for static export
[[redirects]]
  from   = "/*"
  to     = "/404/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
